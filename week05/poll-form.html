<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
</head>
<body>
    <Header>
        <h1>Poll Form Exercise</h1>
    </Header>
    <p>Contact Information</p>
    <form>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname"  name="fullname" required>
    </form>
    <form>
        <label for="useremail">Email</label>
        <input type="email" id="useremail" name="useremail" required>
    </form>
    <p>Questions</p>
    <form>
        <label for="browser">What is your favorite browser?"</label>
        <select  id="browser" name="browser">
            <option value="chrome">Chrome</option>
            <option value="edge">Edge</option>
            <option value="firefox">FireFox</option>
        </select>
    </form>
    <form>
        <label for="pet">Do you have a household pet?</label>
        <input type="checkbox" id="pet" name="pet">
    </form>
    <form>
        <label for="feedback">List the places you have lived:</label>
        <textarea name="feedback" id="feedback" rows="4" placeholder="type here"></textarea>
    </form>
    <form>
        <button type="submit">Submit Poll</button>
    </form>
</body>
<footer>
    <p>2026 © |HTML Form - User Poll Activity | Samuel Ferreira Araújo</p>
</footer>
</html>
