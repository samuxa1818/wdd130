<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for reservations, questions, company information, and rafting adventure support.">
    <meta name="author" content="Samuel Ferreira Araujo">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.png" alt="White Water Rafting Logo">
        <nav>
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h1>White Water Rafting Company</h1>
       
            <div>
                <p>25 Chem. Des Sept Chutes, Municipalité de Grenville-sur-la-Rouge, QC J0V 1B0, Canadá</p>
                <p>+1 800-361-5033</p>
                <p>info@whitewaterrafting.com</p>
            </div>
        </section>

        <div class="to-grid">
            <div class="map">
                <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d89237.4729386123!2d-74.73163960448666!3d45.65742776869664!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4ccee522b8929423%3A0xb77702a86361569c!2sRafting%20Nouveau%20Monde%20-%20New%20World%20Rafting!5e0!3m2!1spt-BR!2sbr!4v1786219186823!5m2!1spt-BR!2sbr"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
      

            <section class="user">
                <form>
                    <section class="user-information">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name">
                        </div>

                        <div>
                            <label for="email">E-mail</label>
                            <input type="email" name="email" id="email">
                        </div>
                    </section>

                    <section class="message-purpose">
                        <div class="inquiry">
                            <input type="radio" id="general" name="message-purpose" value="general">
                            <label for="general">General Inquiry</label>
                        </div>

                        <div class="reservation">
                            <input type="radio" id="reservation" name="message-purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>

                        <div class="website">
                            <input type="radio" id="website" name="message-purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>

                        <div class="message">
                            <label for="message">Message:</label>
                            <textarea name="message" id="message" rows="4"></textarea>
                        </div>
                    </section>

                    <section class="end">
                        <div class="checkbox">
                            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                            <input type="checkbox" name="subscribe" id="subscribe">
                        </div>
                    </section>

                    <button type="submit">Get in Touch</button>
                </form>
            </section>
        </div>
        <section class="employees">
            <h2>We are here to serve you</h2>

            <figure>
                <img src="https://plus.unsplash.com/premium_photo-1661373567809-3ea76deba5c2?q=80&w=869&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Anna Brown - Reservations Manager">
                <figcaption>Anna Brown - Reservations Manager</figcaption>
            </figure>

            <figure>
                <img src="https://plus.unsplash.com/premium_photo-1661396798022-3c5e05af12b4?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="John Smith - Lead Guide">
                <figcaption>John Smith - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="https://plus.unsplash.com/premium_photo-1661769901174-9fffaaa29918?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Mike Davis - Safety Coordinator">
                <figcaption>Mike Davis - Safety Coordinator</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>© 2026 | White Water Rafting | Samuel Ferreira Araújo</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/facebook.png"
                  alt="Facebook Logo"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.png"
                  alt="Linkedin Logo"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.png"
                  alt="Instagram Logo"></a>
        </nav>
    </footer>
</body>

</html>
